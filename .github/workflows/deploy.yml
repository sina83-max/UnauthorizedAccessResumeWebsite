name: VPS Deploy (No Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm build

      - name: Build Go Binary (embeds frontend)
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o portfolio-api .

      - name: Upload binary to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "backend/portfolio-api"
          target: "/var/www/portfolio"
          strip_components: 1

      - name: Setup and restart on VPS
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            mkdir -p /var/www/portfolio
            cd /var/www/portfolio
            chmod +x portfolio-api
            pkill -f portfolio-api || true
            cat > .env << 'ENVEOF'
            DB_URL=postgres://sina@localhost:5432/portfolio?sslmode=disable
            JWT_SECRET=dev-secret-change-in-production
            PORT=8080
            UPLOAD_DIR=uploads
            ENVEOF
            nohup ./portfolio-api > /var/log/portfolio.log 2>&1 &
